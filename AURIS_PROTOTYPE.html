<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auris Prototype</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f0f0f;
      color:white;
    }

    .container{
      width:90%;
      margin:auto;
      padding:40px 0;
    }

    h1{
      font-size:42px;
      margin-bottom:20px;
    }

    .section{
      margin-bottom:60px;
    }

    iframe{
      width:100%;
      border:none;
      border-radius:16px;
    }

    .prototype{
      height:700px;
    }

    .pdf{
      height:800px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="section">
      <h1>AURIS Prototype</h1>

      <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/design/qF6G5tOXSQwRBUImx054CY/AURIS?node-id=39-1316&embed-host=share" allowfullscreen></iframe>
    </div>

    <div class="section">
      <h1>Project PDF</h1>

      <iframe
        class="pdf"
        src="AURIS UI.pdf">
      </iframe>
    </div>

  </div>

</body>
</html>
